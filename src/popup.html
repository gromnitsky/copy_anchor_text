<!doctype html>
<meta charset="utf-8">
<style type="text/css">
  body {
    color: #191919;
    font-family: sans-serif;
    font-size: 16px;
    width: 20em;
  }
  div {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 1rem;
  }
  #error-icon {
    font-size: 300%;
  }
  /*
    hide it from the viewport; with just `display: none` copying to
    clipboard fails
  */
  textarea {
    width: 0;
    height: 0;
    position: fixed;
    right: 0px;
    left: 0px;
    transform: translateX(-50px)
  }
</style>

<div>
  <div id="error-icon">💅</div>
  <div id="error-msg">Move along, nothing to see here</div>
</div>
<textarea></textarea>

<script src="popup.js"></script>
